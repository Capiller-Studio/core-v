en:
  notifications:
    events:
      conversation_created: "New conversation created"
      conversation_assigned: "Conversation assigned to you"
      conversation_resolved: "Conversation resolved"
      sla_breached: "SLA Breach Alert"
      message_created: "New message received"
      conversation_mention: "You were mentioned in a conversation"
      subscription_created: "Subscription activated"
      subscription_renewed: "Subscription renewed"
      subscription_cancelled: "Subscription cancelled"
      trial_expiring: "Your free trial is ending soon"
      payment_failed: "Payment failed"
      limit_approaching: "You are approaching your plan limit"
      limit_reached: "Plan limit reached"
    push:
      conversation_created:
        title: "New Conversation"
        body: "A new conversation has been created in %{inbox_name}"
      conversation_assigned:
        title: "Conversation Assigned"
        body: "Conversation #%{identifier} has been assigned to you"
      conversation_resolved:
        title: "Conversation Resolved"
        body: "Conversation #%{identifier} has been resolved"
      sla_breached:
        title: "SLA Breach Alert"
        body: "SLA breached for conversation #%{identifier}"
      message_created:
        title: "New Message"
        body: "New message in conversation #%{identifier}"
      conversation_mention:
        title: "Mentioned"
        body: "You were mentioned in conversation #%{identifier}"
      subscription_created:
        title: "Subscription Activated"
        body: "Your %{plan_name} plan is now active"
      subscription_renewed:
        title: "Subscription Renewed"
        body: "Your %{plan_name} plan has been renewed"
      subscription_cancelled:
        title: "Subscription Cancelled"
        body: "Your subscription has been cancelled"
      trial_expiring:
        title: "Trial Ending Soon"
        body: "Your free trial ends in %{days} days"
      payment_failed:
        title: "Payment Failed"
        body: "We couldn't process your payment. Please update your payment method."
      limit_approaching:
        title: "Approaching Limit"
        body: "You're at %{percentage}%% of your %{resource} limit"
      limit_reached:
        title: "Limit Reached"
        body: "You've reached your %{resource} limit. Upgrade your plan to continue."
  mailers:
    conversation_reply:
      subject: "Re: %{subject}"
    agent_notification:
      conversation_created:
        subject: "New conversation created"
      conversation_assigned:
        subject: "Conversation assigned to you: #%{identifier}"
      conversation_resolved:
        subject: "Conversation resolved: #%{identifier}"
      sla_breached:
        subject: "SLA Breach Alert: Conversation #%{identifier}"
      message_created:
        subject: "New message in conversation #%{identifier}"
      conversation_mention:
        subject: "You were mentioned in conversation #%{identifier}"
      payment_failed:
        subject: "Payment failed — action required"
      trial_expiring:
        subject: "Your free trial ends in %{days} days"
    system:
      workspace_request:
        subject: "Workspace Joining Request"
    contact_form:
      reply:
        subject: "Re: %{title}"
      confirmation:
        subject: "We received your message: %{title}"
  billing:
    plans:
      starter:
        display_name: "Starter"
        description: "Perfect for getting started. Includes 2 agents and 1 channel."
      momentum:
        display_name: "Momentum"
        description: "For growing teams. Unlimited agents and all channels with 6-month data retention."
      pinnacle:
        display_name: "Pinnacle"
        description: "For scaling businesses. SLA policies, API access, and 12-month data retention."
      enterprise:
        display_name: "Enterprise"
        description: "Custom solutions for large organizations. Unlimited data retention and dedicated support."
  seeds:
    email_templates:
      conversation_reply:
        subject: "Re: {{ subject }}"
        body: |
          <p>{{ agent_name }} replied:</p>
          <div>{{ message_content }}</div>
          <hr>
          <p style="color: #666; font-size: 12px;">
            Reply to this email to continue the conversation.
          </p>
      agent_notification:
        subject: "{{ event_title }}: Conversation #{{ identifier }}"
        body: |
          <p>Hi {{ agent_name }},</p>
          <p>{{ event_description }}</p>
          <p><strong>Conversation:</strong> #{{ identifier }}</p>
          <p><strong>Inbox:</strong> {{ inbox_name }}</p>
          <hr>
          <p style="color: #666; font-size: 12px;">
            You are receiving this because of your notification preferences.
          </p>
  activities:
    presenter:
      translation_updated: "Updated translation contents for locale %{target_locale}"
      enum_changed: "Changed %{attribute} from '%{old}' to '%{new}'"
      attribute_updated: "Updated %{attribute}"
  activerecord:
    errors:
      models:
        integration:
          attributes:
            provider:
              taken: "Only one integration per provider per account"
        subscription:
          attributes:
            account_id:
              active_subscription_exists: "already has an active subscription"
        custom_field:
          attributes:
            name:
              taken_in_account: "is already taken for this account"
            key:
              invalid_format: "only lowercase letters, numbers, and underscores"

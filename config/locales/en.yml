en:
  notifications:
    events:
      conversation_created: "New conversation created"
      conversation_assigned: "Conversation assigned to you"
      conversation_resolved: "Conversation resolved"
      sla_breached: "SLA Breach Alert"
      message_created: "New message received"
      conversation_mention: "You were mentioned in a conversation"
    push:
      conversation_created:
        title: "New Conversation"
        body: "A new conversation has been created in %{inbox_name}"
      conversation_assigned:
        title: "Conversation Assigned"
        body: "Conversation #%{identifier} has been assigned to you"
      conversation_resolved:
        title: "Conversation Resolved"
        body: "Conversation #%{identifier} has been resolved"
      sla_breached:
        title: "SLA Breach Alert"
        body: "SLA breached for conversation #%{identifier}"
      message_created:
        title: "New Message"
        body: "New message in conversation #%{identifier}"
      conversation_mention:
        title: "Mentioned"
        body: "You were mentioned in conversation #%{identifier}"
  mailers:
    conversation_reply:
      subject: "Re: %{subject}"
    agent_notification:
      conversation_created:
        subject: "New conversation created"
      conversation_assigned:
        subject: "Conversation assigned to you: #%{identifier}"
      conversation_resolved:
        subject: "Conversation resolved: #%{identifier}"
      sla_breached:
        subject: "SLA Breach Alert: Conversation #%{identifier}"
      message_created:
        subject: "New message in conversation #%{identifier}"
      conversation_mention:
        subject: "You were mentioned in conversation #%{identifier}"
    system:
      workspace_request:
        subject: "Workspace Joining Request"
  seeds:
    email_templates:
      conversation_reply:
        subject: "Re: {{ subject }}"
        body: |
          <p>{{ agent_name }} replied:</p>
          <div>{{ message_content }}</div>
          <hr>
          <p style="color: #666; font-size: 12px;">
            Reply to this email to continue the conversation.
          </p>
      agent_notification:
        subject: "{{ event_title }}: Conversation #{{ identifier }}"
        body: |
          <p>Hi {{ agent_name }},</p>
          <p>{{ event_description }}</p>
          <p><strong>Conversation:</strong> #{{ identifier }}</p>
          <p><strong>Inbox:</strong> {{ inbox_name }}</p>
          <hr>
          <p style="color: #666; font-size: 12px;">
            You are receiving this because of your notification preferences.
          </p>

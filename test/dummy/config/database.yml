default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch('DB_USERNAME') { 'postgres' } %>
  password: "<%= ENV.fetch('DB_PASSWORD') { 'postgres' } %>"
  host: <%= ENV['DB_HOST'] %>
  pool: 200
  timeout: 100000

development:
  primary:
    <<: *default
    database: deskbolic_development
    migrations_paths: ../../db/migrate
  primary_replica:
    <<: *default
    database: deskbolic_development
    migrations_paths: ../../db/migrate
    replica: true
  de:
    <<: *default
    database: deskbolic_de_development
    migrations_paths: ../../db/migrate_shards
  de_replica:
    <<: *default
    database: deskbolic_de_development
    replica: true

test:
  primary:
    <<: *default
    database: deskbolic_test
    migrations_paths: ../../db/migrate
  primary_replica:
